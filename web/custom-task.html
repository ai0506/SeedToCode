<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="SeedToCode_favicon.png">
<title>作业题 · SeedToCode</title>
<link rel="stylesheet" href="css/styles.css?v=35">
<link rel="stylesheet" href="css/teaching.css?v=20">
<link rel="stylesheet" href="css/task.css?v=8">
<link rel="stylesheet" href="css/custom-task.css?v=7">
</head>
<body>

<!--
   老师自己出的题。
   和课程题目不同：没有测试用例、不判分、不给对错反馈——学生写完自己运行看结果，
   成绩由老师批改。所以这一页只要三样：题面、一个能写能跑的编辑器、提交。

   作答框和课程题用的是同一个编辑器（js/code-input.js）：三空格缩进、`<-` 自动转
   `←`、行号、语法着色。在这之前它只是一个裸 textarea——同一个学生在课程题里养成
   的手感，一到作业题就全部失效，而作业恰好是要交给老师看的那一份。

   题目切换条在左栏顶上：一份作业往往不止一道题，原来每换一道都得退回作业列表
   再点进来，中间还丢掉一次页面载入。
-->

<header class="topbar ct-topbar">
   <div class="topbar-left">
      <a class="btn btn-ghost" href="assignments.html">‹ 我的作业</a>
      <div class="brand-lockup">
         <img class="brand-logo" src="SeedToCode_favicon.png" alt="SeedToCode" width="26" height="26">
         <div class="brand-block">
            <span class="brand">SeedToCode</span>
            <span class="brand-tag">Based on CAIE 9618</span>
         </div>
      </div>
   </div>
   <div class="topbar-center">
      <div class="learn-title">
         <span class="lt-ch" id="ctAssignment"></span>
         <span class="lt-sec" id="ctDue"></span>
      </div>
   </div>
   <div class="topbar-right">
      <span class="assignment-slot" data-assignment-slot>老师出的题</span>
      <a class="btn btn-ghost fixed-btn wide" href="lab.html">实验室</a>
   </div>
</header>

<main class="task-split" id="split">
   <section class="task-pane task-pane-left">
      <div class="pane-head">
         <span class="pane-kicker">题目</span>
         <!-- 窄屏下顶栏放不下截止信息，挪到这里；宽屏时隐藏，内容与 #ctDue 同一份。 -->
         <span class="small ct-due-inline" id="ctDueInline"></span>
         <span class="spacer"></span>
         <span class="small muted ct-counter" id="ctCounter"></span>
      </div>
      <nav class="ct-switch" id="ctSwitch" aria-label="这份作业里的题目"></nav>
      <div class="pane-scroll">
         <h1 class="task-h1" id="ctTitle"></h1>
         <div class="ct-prompt" id="ctPrompt"></div>
         <div class="ct-guidance" id="ctGuidance" hidden>
            <div class="ct-guidance-head">老师的提示</div>
            <div class="ct-guidance-body" id="ctGuidanceBody"></div>
         </div>
         <!--
            老师给的分和评语放在**题目这一栏**，不放作答区。
            放在作答区顶上的话，从一道批过的题切到一道没批的题，整个编辑器会往上跳
            一大块（FRONTEND_RULES 第 1 条）；而且分数和评语说的本来就是这道题。
         -->
         <div class="task-feedback" id="ctFeedback" hidden></div>
      </div>
   </section>

   <div class="split-handle" id="splitHandle" role="separator" aria-orientation="vertical" tabindex="0"></div>

   <section class="task-pane task-pane-right">
      <div class="pane-head">
         <span class="pane-kicker">作答</span>
         <span class="spacer"></span>
         <span class="small muted">写完点「运行」自己看结果；这道题不自动判分，由老师批改</span>
      </div>
      <div class="pane-scroll">
         <div class="mini-editor">
            <div class="mini-editor-head"><span>你的作答</span><span class="spacer"></span>
               <span class="small muted">三空格缩进 · <code class="mono">&lt;-</code> 自动转 <code class="mono">←</code></span></div>
            <div class="mini-editor-body">
               <div class="mini-gutter" id="ctGutter" aria-hidden="true"></div>
               <div class="mini-code">
                  <pre class="mini-highlight" aria-hidden="true"><code></code></pre>
                  <textarea id="ctCode" spellcheck="false" wrap="off" placeholder="从这里开始写…" aria-label="你的作答"></textarea>
               </div>
            </div>
         </div>
         <!--
            「运行」退回普通按钮、「提交」做成这一行唯一的主按钮：两个都染成主色就
            等于一个都不是主的，而交上去才是这一页真正要办的事。
            提交状态是一个定宽三字的常驻槽位（未提交 / 有改动 / 已交过），
            完整的一句话在按钮的 data-tip 里——这一行放不下整句。
         -->
         <div class="ct-actions">
            <button class="btn fixed-btn wide" id="ctRun">▶ 运行</button>
            <button class="btn btn-danger fixed-btn wide" id="ctStop" hidden>■ 停止</button>
            <span class="spacer"></span>
            <span class="small muted" id="ctSaveState"></span>
            <span class="small ct-submit-state" id="ctSubmitState" data-state=""></span>
            <button class="btn btn-primary ct-submit" id="ctSubmit">提交</button>
         </div>
         <div class="ct-console-head">运行结果</div>
         <pre class="ct-console" id="ctConsole"></pre>
         <div class="ct-input-row" id="ctInputRow" hidden>
            <input class="text-field" id="ctInput" placeholder="程序在等输入" aria-label="输入">
            <button class="btn small fixed-btn" id="ctSend">送入</button>
         </div>
      </div>
   </section>
</main>

<div class="task-missing" id="ctMissing" hidden>
   <h1 id="ctMissingTitle">没有找到这道题</h1>
   <p class="muted" id="ctMissingBody">链接里的题目不在你的作业里。</p>
   <p><a class="btn btn-primary" href="assignments.html">回到我的作业</a></p>
</div>

<div class="toast" id="toast" hidden><span id="toastText"></span><button id="toastAction" hidden></button></div>
<div class="tooltip" id="tooltip" hidden></div>

<script src="js/caie-spec.js"></script>
<script src="js/lang.js?v=11"></script>
<script src="js/code-input.js?v=1"></script>
<script src="js/language-engine.js?v=14"></script>
<script src="js/language-adapter.js?v=11"></script>
<script src="js/runtime-engine.js?v=17"></script>
<script src="js/runtime-messages.js?v=5"></script>
<script src="js/tooltip.js?v=1"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/auth-store.js?v=1"></script>
<script src="js/cloud-client.js?v=6"></script>
<script src="js/sync-queue.js?v=3"></script>
<script src="js/sync-engine.js?v=7"></script>
<script src="js/custom-task-page.js?v=7"></script>
</body>
</html>
