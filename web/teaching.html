<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-el-labels="off">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习 · CAIE 9618 伪代码</title>
<link rel="stylesheet" href="css/styles.css?v=22">
<link rel="stylesheet" href="css/teaching.css?v=15">
</head>
<body>

<!--
   教学页外壳。全部正文由 js/teaching-app.js 从 js/teaching-content.js 的数据渲染，
   这里只保留固定框架。版式参照见 teaching-template.html 与 teaching/06-TEMPLATE.md。
-->

<header class="topbar">
   <div class="topbar-left">
      <button class="icon-btn" id="toggleToc" data-tip="显示或隐藏章节目录" aria-label="章节目录">
         <svg class="icon-panel" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"></rect>
            <line x1="6.5" y1="2.5" x2="6.5" y2="13.5"></line>
         </svg>
      </button>
      <div class="brand-block">
         <span class="brand">SeedToCode<span class="brand-dim">Learn</span></span>
         <span class="brand-tag">Based on CAIE 9618</span>
      </div>
   </div>

   <div class="topbar-center">
      <div class="learn-title">
         <span class="lt-ch" id="ltCh"></span>
         <span class="lt-sec" id="ltSec"></span>
      </div>
   </div>

   <div class="topbar-right">
      <div class="switch-field" data-tip="在每个内容块右上角显示内容类型">
         <button class="switch-ctl" id="elLabelToggle" role="switch" aria-checked="false" aria-label="显示内容类型">
            <span class="switch-track"><span class="switch-thumb"></span></span>
         </button>
         <span class="switch-label">内容类型</span>
      </div>
      <div class="progress-slot" data-tip="本章完成度">
         <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
         <span class="progress-num" id="progressNum">0/0</span>
      </div>
      <a class="btn btn-ghost fixed-btn wide" href="index.html">编辑器</a>
   </div>
</header>

<main class="learn">
   <aside class="toc" id="toc">
      <div class="panel-head">
         <span>课程目录</span>
         <span class="head-actions"><span class="chip level-as">AS</span></span>
      </div>
      <div class="toc-scroll">
         <button class="toc-link toc-home" data-goto="home">
            <span class="sn">⌂</span><span class="st">课程主页</span>
         </button>
         <div id="tocChapters"></div>
      </div>
      <div class="toc-foot">
         <p class="muted small" style="margin:0">AS = Chapter 1–16<br>A Level = Chapter 17–23</p>
      </div>
   </aside>

   <div class="reader">
      <div class="reader-scroll" id="readerScroll">
         <div id="reader"></div>
      </div>
      <div class="reader-foot">
         <div class="nav-slot"><button class="btn" id="navPrev" data-goto=""></button></div>
         <span class="spacer"></span>
         <span class="foot-progress" id="footProgress"></span>
         <span class="spacer"></span>
         <div class="nav-slot"><button class="btn btn-primary" id="navNext" data-goto=""></button></div>
      </div>
   </div>
</main>

<footer class="statusbar">
   <span>AS Level</span>
   <span class="dot">·</span>
   <span id="statusSection"></span>
   <span class="dot">·</span>
   <span class="mono" id="statusSyllabus"></span>
   <span class="spacer"></span>
   <span class="status-slot">学习进度</span>
   <span class="dot">·</span>
   <span>CAIE 9618 (2027–2029)</span>
</footer>

<script src="js/caie-spec.js"></script>
<script src="js/lang.js?v=11"></script>
<script src="js/language-engine.js?v=12"></script>
<script src="js/language-adapter.js?v=9"></script>
<script src="js/runtime-engine.js?v=10"></script>
<script src="js/runtime-messages.js?v=3"></script>
<script src="js/exercise-engine.js?v=17"></script>
<script src="js/teaching-content.js?v=23"></script>
<script src="js/storage.js?v=1"></script>
<script src="js/teaching-task.js?v=11"></script>
<script src="js/teaching-app.js?v=27"></script>
</body>
</html>
