<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="SeedToCode_favicon.png">
<title>我的作业 · SeedToCode</title>
<link rel="stylesheet" href="css/styles.css?v=26">
<link rel="stylesheet" href="css/account.css?v=2">
<link rel="stylesheet" href="css/assignments.css?v=1">
</head>
<body>

<!--
   学生的作业页。
   在这之前作业只出现在右上角账户浮层里：入口隐蔽，只显示分数看不到评语，
   而且点进题目之后和普通课程练习长得一模一样，分不清哪些是老师布置的。
   这里给作业一个自己的地方：哪几道、交没交、老师给了几分、评语是什么，一屏看完。
-->

<header class="topbar">
   <div class="topbar-left">
      <div class="brand-lockup">
         <img class="brand-logo" src="SeedToCode_favicon.png" alt="SeedToCode" width="26" height="26">
         <div class="brand-block">
            <span class="brand">SeedToCode</span>
            <span class="brand-tag">Based on CAIE 9618</span>
         </div>
      </div>
      <nav class="topnav" id="topNav" aria-label="主导航"></nav>
   </div>

   <div class="topbar-center">
      <div class="learn-title">
         <span class="lt-ch">我的作业</span>
         <span class="lt-sec" id="assignmentSummary"></span>
      </div>
   </div>

   <div class="topbar-right">
   </div>
</header>

<main class="hw-main">
   <div class="hw-gate" id="hwGate" hidden>
      <h1 id="gateTitle"></h1>
      <p class="muted" id="gateBody"></p>
      <div class="hw-gate-actions" id="gateActions"></div>
   </div>
   <div class="hw-list" id="hwList"></div>
</main>

<footer class="statusbar">
   <span>我的作业</span>
   <span class="dot">·</span>
   <span id="statusLine"></span>
   <span class="spacer"></span>
   <span>CAIE 9618 (2027–2029)</span>
</footer>

<script src="js/caie-spec.js"></script>
<script src="js/lang.js?v=11"></script>
<script src="js/teaching-content.js?v=25"></script>
<script src="js/tooltip.js?v=1"></script>
<script src="js/storage.js?v=2"></script>
<script src="js/auth-store.js?v=1"></script>
<script src="js/cloud-client.js?v=4"></script>
<script src="js/sync-queue.js?v=1"></script>
<script src="js/sync-engine.js?v=2"></script>
<script src="js/account-ui.js?v=7"></script>
<script src="js/assignments-page.js?v=3"></script>
<div class="tooltip" id="tooltip" hidden></div>
</body>
</html>
