<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="SeedToCode_favicon.png">
<title>登录 · SeedToCode</title>
<link rel="stylesheet" href="css/styles.css?v=28">
<link rel="stylesheet" href="css/login.css?v=4">
</head>
<body class="login-body">

<!--
   独立登录页，三步：
     1. 你有账号吗（登录 / 注册）
     2. 你是谁（学生 / 老师 / 个人学习者）
     3. 对应的表单
   身份原来是第一步，于是「注册」这个念头要到第三屏才有着落，而且老师选错身份
   登录会一直被告知「密码不正确」。先分登录还是注册，两条路从头就是分开的。

   三步共用一个高度受控的容器：换屏时高度做一次很短的过渡，内容淡入，
   卡片不会忽大忽小地跳。

   登录始终不是使用的前提：没有账号、云端没配、断网，都能从这一页直接
   回到编辑器和课程，本地功能一样不少。
-->

<header class="login-top">
   <a class="brand-lockup login-brand" href="lab.html">
      <img class="brand-logo" src="SeedToCode_favicon.png" alt="SeedToCode" width="26" height="26">
      <span class="brand-block">
         <span class="brand">SeedToCode</span>
         <span class="brand-tag">Based on CAIE 9618</span>
      </span>
   </a>
   <span class="spacer"></span>
   <a class="btn btn-ghost fixed-btn wide" href="lab.html" id="skipLogin">先不登录，直接用</a>
</header>

<main class="login-main">
   <div class="login-card">
      <h1 class="login-title" id="loginTitle">账号</h1>
      <p class="login-lead" id="loginLead">
         不登录也能完整使用编辑器、课程和做题。登录是为了换一台设备还能接着写、接着学。
      </p>

      <!-- 云端未配置 / 已登录 / 验证邮件已发出，都落到这里 -->
      <div class="login-notice" id="loginNotice" hidden>
         <p id="loginNoticeText"></p>
         <div class="login-actions" id="loginNoticeActions"></div>
      </div>

      <div id="loginFlow">
         <!-- 高度过渡容器：里面同一时刻只有一屏是可见的 -->
         <div class="login-steps" id="loginSteps">

            <!-- 面包屑：第二步起显示「登录」「注册 · 学生」 -->
            <div class="login-chosen" id="chosenRow" hidden>
               <span class="login-chosen-name" id="chosenName"></span>
               <button type="button" class="login-link" id="stepBack">上一步</button>
            </div>

            <!-- 第一步 -->
            <section class="login-step" id="intentStep">
               <h2 class="login-label">你有账号吗？</h2>
               <div class="role-list intent-list">
                  <button type="button" class="role-option" data-intent="login">
                     <span class="role-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><path d="M13 6H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6"></path><path d="M20 11l5 5-5 5"></path><path d="M25 16H12"></path></svg>
                     </span>
                     <span class="role-name">我有账号</span>
                     <span class="role-desc">直接登录</span>
                  </button>
                  <button type="button" class="role-option" data-intent="register">
                     <span class="role-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><circle cx="13" cy="11" r="5"></circle><path d="M4 27c0-5 4-8 9-8 1.4 0 2.8.2 4 .7"></path><path d="M24 18v9"></path><path d="M19.5 22.5h9"></path></svg>
                     </span>
                     <span class="role-name">还没有，要注册</span>
                     <span class="role-desc">第一次用</span>
                  </button>
               </div>
            </section>

            <!-- 第二步 -->
            <section class="login-step" id="roleStep" hidden>
               <h2 class="login-label">你是</h2>
               <div class="role-list" id="roleList">
                  <button type="button" class="role-option" data-role="student">
                     <span class="role-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><path d="M16 6 4 12l12 6 12-6z"></path><path d="M9 15v6c0 2 3.5 4 7 4s7-2 7-4v-6"></path><path d="M28 12v8"></path></svg>
                     </span>
                     <span class="role-name">学生</span>
                     <span class="role-desc">老师带着学</span>
                  </button>
                  <button type="button" class="role-option" data-role="teacher">
                     <span class="role-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><rect x="4" y="5" width="24" height="16" rx="2"></rect><path d="M12 26h8"></path><path d="M16 21v5"></path><path d="M10 16l4-5 3 3 5-6"></path></svg>
                     </span>
                     <span class="role-name">老师</span>
                     <span class="role-desc">建班级、布置作业</span>
                  </button>
                  <button type="button" class="role-option" data-role="learner">
                     <span class="role-icon" aria-hidden="true">
                        <svg viewBox="0 0 32 32"><path d="M5 7h8a4 4 0 0 1 3 1.6A4 4 0 0 1 19 7h8v17h-8a4 4 0 0 0-3 1.4A4 4 0 0 0 13 24H5z"></path><path d="M16 8.6V25"></path></svg>
                     </span>
                     <span class="role-name">个人学习者</span>
                     <span class="role-desc">自己学、自己练</span>
                  </button>
               </div>
            </section>

            <!-- 第三步 A：老师 / 个人学习者，登录和注册共用一套字段 -->
            <form class="login-step login-form" id="emailForm" hidden>
               <label class="login-field">
                  <span class="login-field-label">邮箱</span>
                  <input class="text-field block" type="email" id="loginEmail" autocomplete="email" spellcheck="false" placeholder="you@example.com">
               </label>
               <label class="login-field">
                  <span class="login-field-label" id="emailPasswordLabel">密码</span>
                  <span class="login-input-wrap">
                     <input class="text-field block has-reveal" type="password" id="emailPassword" autocomplete="current-password">
                     <button type="button" class="pw-reveal" data-reveal="emailPassword" aria-label="显示密码" aria-pressed="false" tabindex="-1">显示</button>
                  </span>
               </label>
               <div class="field-error" id="emailError"></div>
               <button class="btn btn-primary login-submit" type="submit" id="emailSubmit">登录</button>
               <p class="login-hint" id="emailHint"></p>
            </form>

            <!-- 第三步 B：学生登录 -->
            <form class="login-step login-form" id="studentLoginForm" hidden>
               <label class="login-field">
                  <span class="login-field-label">用户名</span>
                  <input class="text-field block" id="studentUsername" autocomplete="username" spellcheck="false" placeholder="老师给你的用户名">
               </label>
               <label class="login-field">
                  <span class="login-field-label">密码</span>
                  <span class="login-input-wrap">
                     <input class="text-field block has-reveal" type="password" id="studentPassword" autocomplete="current-password">
                     <button type="button" class="pw-reveal" data-reveal="studentPassword" aria-label="显示密码" aria-pressed="false" tabindex="-1">显示</button>
                  </span>
               </label>
               <div class="field-error" id="studentError"></div>
               <button class="btn btn-primary login-submit" type="submit">登录</button>
               <p class="login-hint">
                  还没设过密码？<button type="button" class="login-link" data-go="register">去注册</button>
               </p>
            </form>

            <!-- 第三步 C：学生注册。两种情形字段不同，用分段控件切，不再是整屏切换。 -->
            <section class="login-step" id="studentRegisterStep" hidden>
               <div class="login-choice" role="tablist" aria-label="老师给了你什么">
                  <button type="button" class="login-choice-btn login-choice-active" role="tab" aria-selected="true" data-student-reg="activate">用户名和激活码</button>
                  <button type="button" class="login-choice-btn" role="tab" aria-selected="false" data-student-reg="join">一个班级码</button>
               </div>

               <form class="login-form" id="studentActivateForm">
                  <label class="login-field">
                     <span class="login-field-label">用户名</span>
                     <input class="text-field block" id="activateUsername" autocomplete="username" spellcheck="false" placeholder="老师给你的用户名">
                  </label>
                  <label class="login-field">
                     <span class="login-field-label">激活码</span>
                     <input class="text-field block code-field" id="activateCode" autocomplete="one-time-code" spellcheck="false" placeholder="老师给你的 6 位码" maxlength="8" autocapitalize="characters">
                  </label>
                  <label class="login-field">
                     <span class="login-field-label">设置密码</span>
                     <span class="login-input-wrap">
                        <input class="text-field block has-reveal" type="password" id="activatePassword" autocomplete="new-password" placeholder="至少 10 个字符">
                        <button type="button" class="pw-reveal" data-reveal="activatePassword" aria-label="显示密码" aria-pressed="false" tabindex="-1">显示</button>
                     </span>
                  </label>
                  <div class="field-error" id="activateError"></div>
                  <button class="btn btn-primary login-submit" type="submit">激活并登录</button>
                  <p class="login-hint">
                     激活码是 6 位字母数字，不区分大小写，只能用一次；之后就用你自己设的密码登录。
                  </p>
               </form>

               <form class="login-form" id="studentJoinForm" hidden>
                  <label class="login-field">
                     <span class="login-field-label">班级码</span>
                     <input class="text-field block code-field" id="registerJoinCode" spellcheck="false" autocomplete="off"
                            placeholder="老师念的 6 位码" maxlength="10" autocapitalize="characters">
                  </label>
                  <label class="login-field">
                     <span class="login-field-label">你的姓名</span>
                     <input class="text-field block" id="registerDisplayName" autocomplete="name" placeholder="老师在名单里看到的名字">
                  </label>
                  <label class="login-field">
                     <span class="login-field-label">用户名</span>
                     <input class="text-field block" id="registerUsername" autocomplete="username" spellcheck="false" placeholder="自己起一个，用来登录">
                  </label>
                  <label class="login-field">
                     <span class="login-field-label">设置密码</span>
                     <span class="login-input-wrap">
                        <input class="text-field block has-reveal" type="password" id="registerPassword" autocomplete="new-password" placeholder="至少 10 个字符">
                        <button type="button" class="pw-reveal" data-reveal="registerPassword" aria-label="显示密码" aria-pressed="false" tabindex="-1">显示</button>
                     </span>
                  </label>
                  <div class="field-error" id="registerError"></div>
                  <button class="btn btn-primary login-submit" type="submit">注册并加入班级</button>
                  <p class="login-hint">
                     全班同一个码，用户名和密码你自己定，不需要邮箱。姓名要写真名，老师按它在名单里认人。
                  </p>
               </form>
            </section>
         </div>
      </div>
   </div>
</main>

<footer class="login-foot">
   <span>CAIE 9618 (2027–2029)</span>
   <span class="dot">·</span>
   <span>本产品不是 Cambridge 官方产品，也未获得官方授权</span>
</footer>

<script src="js/storage.js?v=2"></script>
<script src="js/auth-store.js?v=1"></script>
<script src="js/cloud-client.js?v=4"></script>
<script src="js/login-page.js?v=4"></script>
</body>
</html>
