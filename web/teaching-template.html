<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-el-labels="on">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" href="SeedToCode_favicon.png">
<title>教学页版式参照 · CAIE 9618</title>
<link rel="stylesheet" href="css/styles.css?v=29">
<link rel="stylesheet" href="css/teaching.css?v=16">
</head>
<body>

<!--
   版式参照页。
   它和真实教学页 learn.html 用的是**同一个渲染器** js/teaching-app.js，
   区别只在于这里喂给它的是一份占位数据（见页面底部的 PLACEHOLDER_COURSE）。
   这样版式不会和实际页面走样，也不需要维护两份 HTML。

   用途：
     · 审版式：所有内容块一次看全，包括实际章节里暂时没用到的块（如填空题）
     · 试新块：先在这里加占位数据，看形态定了再写进内容规格
   「内容类型」默认打开：每个块右上角显示内容类型。
-->

<header class="topbar">
   <div class="topbar-left">
      <button class="icon-btn" id="toggleToc" data-tip="显示或隐藏章节目录" aria-label="章节目录">
         <svg class="icon-panel" viewBox="0 0 16 16" aria-hidden="true">
            <rect x="1.5" y="2.5" width="13" height="11" rx="2.5"></rect>
            <line x1="6.5" y1="2.5" x2="6.5" y2="13.5"></line>
         </svg>
      </button>
      <span class="brand">Pseudocode<span class="brand-dim">Learn</span></span>
      <span class="badge" style="background:var(--warn-soft);color:var(--warn);border-color:transparent">版式参照</span>
   </div>

   <div class="topbar-center">
      <div class="learn-title">
         <span class="lt-ch" id="ltCh"></span>
         <span class="lt-sec" id="ltSec"></span>
      </div>
   </div>

   <div class="topbar-right">
      <div class="switch-field" data-tip="在每个内容块右上角显示内容类型">
         <button class="switch-ctl" id="elLabelToggle" role="switch" aria-checked="true" aria-label="显示内容类型">
            <span class="switch-track"><span class="switch-thumb"></span></span>
         </button>
         <span class="switch-label">内容类型</span>
      </div>
      <div class="progress-slot" data-tip="本章完成度">
         <div class="progress-track"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
         <span class="progress-num" id="progressNum">0/0</span>
      </div>
      <a class="btn btn-ghost fixed-btn wide" href="learn.html">真实页面</a>
   </div>
</header>

<main class="learn">
   <aside class="toc" id="toc">
      <div class="panel-head">
         <span>课程目录</span>
         <span class="head-actions"><span class="chip level-as">AS</span></span>
      </div>
      <div class="toc-scroll">
         <button class="toc-link toc-home" data-goto="home">
            <span class="sn">⌂</span><span class="st">课程主页</span>
         </button>
         <div id="tocChapters"></div>
      </div>
      <div class="toc-foot">
         <p class="muted small" style="margin:0">这一页的内容全部是占位。<br>真实内容见 learn.html。</p>
      </div>
   </aside>

   <div class="reader">
      <div class="reader-scroll" id="readerScroll">
         <div id="reader"></div>
      </div>
      <div class="reader-foot">
         <div class="nav-slot"><button class="btn" id="navPrev" data-goto=""></button></div>
         <span class="spacer"></span>
         <span class="foot-progress" id="footProgress"></span>
         <span class="spacer"></span>
         <div class="nav-slot"><button class="btn btn-primary" id="navNext" data-goto=""></button></div>
      </div>
   </div>
</main>

<footer class="statusbar">
   <span>AS Level</span>
   <span class="dot">·</span>
   <span id="statusSection"></span>
   <span class="dot">·</span>
   <span class="mono" id="statusSyllabus"></span>
   <span class="spacer"></span>
   <span class="status-slot">版式参照</span>
   <span class="dot">·</span>
   <span>CAIE 9618 (2027–2029)</span>
</footer>

<script src="js/caie-spec.js"></script>
<script src="js/lang.js?v=11"></script>
<script src="js/code-input.js?v=1"></script>
<script src="js/language-engine.js?v=13"></script>
<script src="js/language-adapter.js?v=10"></script>
<script src="js/runtime-engine.js?v=11"></script>
<script src="js/runtime-messages.js?v=5"></script>
<script src="js/exercise-engine.js?v=18"></script>
<script>
/* 占位数据。结构与 packages/teaching-content 完全一致，只是内容是【占位】。
   这里刻意把所有块类型都摆一遍，包括 Chapter 1 没用到的填空题。 */
window.CAIETeaching = {
   course: {
      syllabusVersion: "CAIE 9618 (2027–2029)",
      chapters: [{
         id: 0,
         title: "版式参照章",
         level: "AS",
         syllabus: ["§0.0"],
         prerequisites: [],
         sections: [
            {
               id: "0.1",
               title: "讲解、示例与对照",
               syllabus: ["§0.0", "G§0"],
               estimatedMinutes: 10,
               taughtFeatures: ["io.output", "io.input", "decl.variable", "misc.comment"],
               blocks: [
                  {
                     kind: "explanation",
                     paragraphs: [
                        "【占位】讲解的第一段：先说为什么需要它。这里应当从一个学生已经会写的场景出发，而不是直接给出语法框。",
                        "【占位】第二段：引出新术语。术语首次出现写成「中文（English）」，同一章内之后只写中文。",
                        "【占位】第三段：说明它怎么写、执行顺序是什么。一段只讲一件事。"
                     ],
                     callouts: [
                        { source: "CAIE", text: "【占位】能追溯到考纲或 Pseudocode Guide 的规则写在这里。" },
                        { source: "editor", text: "【占位】Cambridge 没有规定、但程序要跑就得有个说法的行为写在这里。" }
                     ]
                  },
                  {
                     kind: "example",
                     title: "【占位】示例标题",
                     fileName: "Example_0_1_a.pseudocode",
                     code: 'DECLARE Name : STRING\nOUTPUT "What is your name?"\nINPUT Name\nOUTPUT "Hello, ", Name',
                     annotations: [
                        { fromLine: 1, toLine: 1, text: "【占位】单行注释：这一行在做什么。" },
                        { fromLine: 2, toLine: 3, text: "【占位】行区间注释：鼠标移上来时，代码里对应的两行会高亮。" },
                        { fromLine: 4, toLine: 4, text: "【占位】注释里可以写 `代码` 和 **强调**。" }
                     ],
                     sampleRun: { inputs: ["Ada"], outputs: ["What is your name?", "Hello, Ada"] }
                  },
                  {
                     kind: "comparison",
                     title: "【占位】同一件事的三种写法",
                     intro: "【占位】一句引子：为什么要把这三种写法放在一起看。",
                     panes: [
                        {
                           label: "自然语言",
                           language: "natural",
                           code: "【占位】用日常说法描述的\n同一件事，\n读起来最轻松。",
                           note: "【占位】这一栏暴露了什么——通常是「哪里没说清楚」。"
                        },
                        {
                           label: "伪代码",
                           language: "pseudocode",
                           code: 'DECLARE Name : STRING\nOUTPUT "What is your name?"\nINPUT Name\nOUTPUT "Hello, ", Name',
                           note: "【占位】只有这一栏做语法着色，也只有这一栏进引擎校验。"
                        },
                        {
                           label: "真实的编程语言（Python）",
                           language: "python",
                           code: 'print("What is your name?")\nname = input()\nprint("Hello, " + name)',
                           note: "【占位】这一栏暴露了什么——通常是「哪些是这门语言自己的规矩」。"
                        }
                     ]
                  },
                  {
                     kind: "quiz",
                     type: "single-choice",
                     prompt: "【占位】单选题干。答错会就地标记并说明原因，然后可以再选。",
                     code: 'OUTPUT "C"\nOUTPUT "A"\nOUTPUT "B"',
                     options: [
                        { key: "A", label: "【占位】选项 A", correct: false, explanation: "【占位】为什么这个不对——要指出学生在哪一步想错了。" },
                        { key: "B", label: "【占位】选项 B", correct: true, explanation: "【占位】为什么这个对。给出判断依据。" },
                        { key: "C", label: "【占位】选项 C", correct: false, explanation: "【占位】这个选项常见的误解来源。" },
                        { key: "D", label: "【占位】选项 D", correct: false, explanation: "【占位】把另一种结构的行为记到这里来了。" }
                     ]
                  }
               ]
            },
            {
               id: "0.2",
               title: "反例与另外两种关卡",
               syllabus: ["G§0"],
               estimatedMinutes: 8,
               taughtFeatures: ["io.output", "io.input", "decl.variable", "misc.comment"],
               blocks: [
                  {
                     kind: "counterExample",
                     title: "【占位】反例标题",
                     // 反例是若干个并列的短情形：有的在静态检查就被拦下，有的要跑到那一行才失败
                     cases: [
                        {
                           title: "【占位】静态检查就拦下的情形",
                           code: 'OUTPUT "Hello"\nOUTPUT',
                           note: "【占位】这段代码为什么会被拦下，怎么改。",
                           expectDiagnostics: [
                              { severity: "error", ruleId: "IO-002", line: 2, text: "【占位】阻断错误级：不改就跑不了。" },
                              { severity: "caie", ruleId: "FMT-004", line: 1, text: "【占位】CAIE 规范级：能跑，但写法不符合规定。" },
                              { severity: "hint", ruleId: "FMT-002", line: 1, text: "【占位】建议级：这样写更清楚。" }
                           ]
                        },
                        {
                           title: "【占位】跑到那一行才失败的情形",
                           code: 'DECLARE Total : INTEGER\nTotal ← 10 / 0',
                           note: "【占位】类型全对、静态检查零提示，但执行到这一行才停。",
                           expectRuntimeError: { code: "RT2001", line: 2, text: "【占位】运行到这一行时发生了什么。" }
                        }
                     ]
                  },
                  {
                     kind: "quiz",
                     type: "click-line",
                     prompt: "【占位】点击找错题干：点出有问题的那一行。",
                     lines: [
                        { code: "DECLARE Name : STRING", explanation: "【占位】这一行没问题，它的作用是……" },
                        { code: "INPUT Name", explanation: "【占位】这一行没问题，它的作用是……" },
                        { code: 'OUTPUT "What is your name?"', answer: true, explanation: "【占位】就是这一行。原因是……" },
                        { code: 'OUTPUT "Hello, ", Name', explanation: "【占位】这一行没问题，它的作用是……" }
                     ]
                  }
               ]
            },
            {
               id: "0.3",
               title: "填空题与伪代码题",
               syllabus: ["G§0"],
               estimatedMinutes: 12,
               taughtFeatures: ["io.output", "io.input", "decl.variable", "misc.comment"],
               blocks: [
                  {
                     kind: "quiz",
                     type: "fill-blank",
                     prompt: "【占位】填空题干：点一个空，再点候选词。填错会清空重填。",
                     template: 'DECLARE Name : STRING\n__1__ "What is your name?"\n__2__ Name\nOUTPUT "Hello, ", Name',
                     blanks: [
                        { index: 1, answer: "OUTPUT" },
                        { index: 2, answer: "INPUT" }
                     ],
                     bank: [
                        { word: "OUTPUT", explanation: "【占位】它是这里的正确答案，因为……" },
                        { word: "INPUT", explanation: "【占位】它是这里的正确答案，因为……" },
                        { word: "DECLARE", explanation: "【占位】为什么这里不该用它。" },
                        { word: "PRINT", explanation: "【占位】CAIE 伪代码里没有这个词。" },
                        { word: "ENDWHILE", explanation: "【占位】空位的宽度就是按这个最长候选定的。" }
                     ]
                  },
                  {
                     kind: "task",
                     id: "0.3.1",
                     title: "【占位】小节题标题",
                     statement: "【占位】题目要求。一句话说清要做什么，不绕弯子。",
                     ioSpec: {
                        input: "【占位】读几行、每行是什么、什么类型。",
                        output: "【占位】输出几行、每行的格式，精确到空格。"
                     },
                     constraints: {
                        require: [{ feature: "io.input", reason: "【占位】为什么必须用它——约束一定要讲理由。" }],
                        forbid: [{ feature: "loop.for", reason: "【占位】为什么不能用它。" }]
                     },
                     hints: [
                        "【占位】提示 1：给方向。",
                        "【占位】提示 2：给结构。",
                        "【占位】提示 3：给关键行的写法，但不给完整答案。"
                     ],
                     examples: [{ inputs: ["Ada", "Lagos"], outputs: ["Ada lives in Lagos"] }],
                     starterCode: "DECLARE Name : STRING\n",
                     tests: [
                        { id: "t1", kind: "normal", inputs: ["Chen", "Shanghai"], caseHint: "【占位】一组普通数据。", expected: ["Chen lives in Shanghai"] },
                        { id: "t2", kind: "boundary", inputs: ["A", "B"], caseHint: "【占位】当两项都只有一个字母时。", expected: ["A lives in B"] }
                     ]
                  }
               ]
            }
         ],
         chapterTasks: [{
            kind: "chapterTask",
            id: "0.T1",
            title: "【占位】章末大题标题",
            statement: "【占位】章末大题只做软约束：写得对就算过，没用到的知识点只提示。",
            ioSpec: { input: "【占位】输入说明。", output: "【占位】输出说明。" },
            suggestedFeatures: ["io.input", "io.output", "decl.variable", "misc.comment"],
            hints: ["【占位】提示 1。", "【占位】提示 2。", "【占位】提示 3。"],
            examples: [{ inputs: ["Ada"], outputs: ["Hello, Ada"] }],
            tests: [
               { id: "t1", kind: "normal", inputs: ["Chen"], caseHint: "【占位】一组普通数据。", expected: ["Hello, Chen"] }
            ]
         }]
      }]
   }
};
</script>
<script src="js/teaching-task.js?v=14"></script>
<script src="js/teaching-app.js?v=30"></script>
</body>
</html>
